<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TerraScape × Gemini AI</title>
  <style>
    :root {
      --bg: #0c0a09;
      --card: #1c1917;
      --border: #292524;
      --emerald: #10b981;
      --emerald-light: #34d399;
      --text: #f5f5f4;
      --muted: #a8a29e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: var(--emerald-light);
    }
    .model-select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
    }
    .api-bar {
      display: flex;
      gap: 6px;
      background: var(--card);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    input, textarea, select {
      background: #141210;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 12px;
      width: 100%;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--emerald);
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--card);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 7px 4px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: rgba(16, 185, 129, 0.18);
      color: var(--emerald-light);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .panel.active {
      display: flex;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    .btn {
      background: var(--emerald);
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      opacity: 0.92;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #292524;
      color: var(--text);
      font-weight: 600;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .chip {
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #292524;
      color: #d6d3d1;
      border: 1px solid #44403c;
      cursor: pointer;
    }
    .chip:hover {
      border-color: var(--emerald);
      color: var(--emerald-light);
    }
    pre {
      background: #090807;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      color: var(--emerald-light);
      max-height: 170px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status {
      font-size: 11px;
      color: var(--emerald-light);
      min-height: 16px;
    }
    .status.error {
      color: #fb7185;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">🌿 TerraScape × Gemini</div>
    <select id="modelSelect" class="model-select" title="Gemini Model">
      <option value="gemini-3.8-flash">Gemini 3.8 Flash (Fast)</option>
      <option value="gemini-4-argon">Gemini 4 Argon (Deep Reasoning)</option>
    </select>
  </div>

  <!-- Gemini API Key Bar -->
  <div class="api-bar">
    <input
      id="apiKeyInput"
      type="password"
      placeholder="Paste Google AI Studio Gemini API Key (AIza...)"
    />
    <button id="saveKeyBtn" class="btn btn-secondary" style="white-space: nowrap;">Save Key</button>
  </div>

  <!-- Navigation Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="svgTab">1. Botanical SVG</button>
    <button class="tab-btn" data-tab="layoutTab">2. UI &amp; Schematics</button>
    <button class="tab-btn" data-tab="exportTab">3. Export to Code</button>
  </div>

  <!-- TAB 1: BOTANICAL & HARDSCAPE SVG GENERATOR -->
  <div id="svgTab" class="panel active">
    <div>
      <label>Quick Prompts</label>
      <div class="chips">
        <span class="chip" data-svg-prompt="Bioluminescent Ghost Fungi cluster on mossy bark with glowing cyan caps">Glow Fungi</span>
        <span class="chip" data-svg-prompt="Miniature Jewel Orchid (Macodes petola) with lightning-gold leaf veins">Jewel Orchid</span>
        <span class="chip" data-svg-prompt="Weathered Seiryu mountain stone with creeping Ficus pumila vines">Seiryu Stone</span>
        <span class="chip" data-svg-prompt="Carnivorous Sundew (Drosera) rosette with glistening ruby dew drops">Sundew Plant</span>
      </div>
    </div>

    <div>
      <label>Botanical / Hardscape Specimen Prompt</label>
      <textarea
        id="svgPrompt"
        rows="3"
        placeholder="Describe a botanical plant, moss, driftwood, or rock specimen to generate as layered vector SVG..."
      >Miniature Jewel Orchid (Macodes petola) with dark velvet leaves and shimmering gold-emerald veins</textarea>
    </div>

    <div class="row">
      <div>
        <label>Category</label>
        <select id="svgCategory">
          <option value="flora">Flora (Plant / Moss)</option>
          <option value="hardscape">Hardscape (Stone / Wood)</option>
        </select>
      </div>
      <div>
        <label>Night UV Bioluminescence</label>
        <select id="svgGlow">
          <option value="false">Standard Daylight Specimen</option>
          <option value="true">Bioluminescent (Glows at Night)</option>
        </select>
      </div>
    </div>

    <button id="generateSvgBtn" class="btn">✨ Generate Vector SVG on Figma Canvas</button>
  </div>

  <!-- TAB 2: UI & HARDWARE SPEC SHEET GENERATOR -->
  <div id="layoutTab" class="panel">
    <div>
      <label>Quick Section Templates (Phase 2 Roadmap)</label>
      <div class="chips">
        <span class="chip" data-layout-prompt="Andrew's Signature 1-of-1 Builds showcase cards with vessel specs, BOM pricing, and Load in Studio CTAs">Andrew's Signature Builds</span>
        <span class="chip" data-layout-prompt="Inside the Engineering: Custom PWM Circadian LED Ring, 113kHz Ultrasonic Piezo Mist Atomizer, and SHT40 Closed-Loop Climate Controller spec cards with block schematics">Inside the Engineering (PCB Specs)</span>
        <span class="chip" data-layout-prompt="5-Stage Custom Vivarium Order & Quarantine Assembly Tracker UI (BLUEPRINT_RECEIVED -> CIRCUIT_SOLDERING -> PLANTING -> QUARANTINE -> SHIPPED)">Phase 3 Order Tracker</span>
      </div>
    </div>

    <div>
      <label>UI Section / Hardware Spec Prompt</label>
      <textarea
        id="layoutPrompt"
        rows="3"
        placeholder="Describe the Figma Auto-Layout section, showcase gallery, or hardware circuit spec cards..."
      >Inside the Engineering: Custom PWM Circadian LED Ring, 113kHz Ultrasonic Piezo Mist Atomizer, and SHT40 Closed-Loop Climate Controller spec cards with block schematics</textarea>
    </div>

    <button id="generateLayoutBtn" class="btn">📐 Generate Auto-Layout Frame + Schematics</button>
  </div>

  <!-- TAB 3: EXPORT SELECTED FIGMA NODES TO TERRASCAPE -->
  <div id="exportTab" class="panel">
    <div style="font-size: 11px; color: var(--muted);">
      Selected on Canvas: <strong id="selectionLabel" style="color: var(--emerald-light);">0 nodes</strong>
    </div>

    <div class="row">
      <button id="exportSelectionBtn" class="btn">📤 Export Selected SVG</button>
      <button id="optimizeWithGeminiBtn" class="btn btn-secondary">🪄 Gemini JSX + Night Mode</button>
    </div>

    <div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
        <label style="margin: 0;">Ready-to-Paste `TerrariumBuilder.tsx` / Blueprint Output</label>
        <button id="copyOutputBtn" class="chip">Copy Code</button>
      </div>
      <pre id="exportOutput">// Select any vector, plant illustration, or frame in Figma and click "Export Selected SVG"...</pre>
    </div>
  </div>

  <div id="statusText" class="status">Ready.</div>

  <script>
    let lastExportedItems = [];

    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelSelect = document.getElementById('modelSelect');
    const statusText = document.getElementById('statusText');
    const selectionLabel = document.getElementById('selectionLabel');
    const exportOutput = document.getElementById('exportOutput');

    function setStatus(text, isError = false) {
      statusText.textContent = text;
      statusText.className = isError ? 'status error' : 'status';
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // Quick prompt chips
    document.querySelectorAll('[data-svg-prompt]').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.getElementById('svgPrompt').value = chip.dataset.svgPrompt;
      });
    });
    document.querySelectorAll('[data-layout-prompt]').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.getElementById('layoutPrompt').value = chip.dataset.layoutPrompt;
      });
    });

    // Save API key
    document.getElementById('saveKeyBtn').addEventListener('click', () => {
      const apiKey = apiKeyInput.value.trim();
      parent.postMessage({ pluginMessage: { type: 'SAVE_API_KEY', apiKey } }, '*');
      setStatus('Saved Gemini API key.');
    });

    // Helper: Call Gemini Interactions API (v1beta/interactions) with Structured JSON Output
    async function callGeminiInteractions(prompt, jsonSchema) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        throw new Error('Please paste your Gemini API key at the top first.');
      }
      const model = modelSelect.value || 'gemini-3.8-flash';

      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/interactions?key=${encodeURIComponent(apiKey)}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model,
            input: prompt,
            response_format: {
              type: 'text',
              mime_type: 'application/json',
              schema: jsonSchema,
            },
          }),
        }
      );

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Gemini API Error (${response.status}): ${errText}`);
      }

      const data = await response.json();

      // Extract text from Interactions API response (output_text or model_output steps)
      if (typeof data.output_text === 'string' && data.output_text.trim()) {
        return JSON.parse(data.output_text);
      }
      if (Array.isArray(data.steps)) {
        for (let i = data.steps.length - 1; i >= 0; i--) {
          const step = data.steps[i];
          if (step.type === 'model_output' && Array.isArray(step.content)) {
            for (const part of step.content) {
              if (part.type === 'text' && part.text) {
                return JSON.parse(part.text);
              }
            }
          }
        }
      }
      throw new Error('Could not parse structured JSON from Gemini Interaction response.');
    }

    // 1. Generate Botanical / Hardscape SVG
    document.getElementById('generateSvgBtn').addEventListener('click', async () => {
      const btn = document.getElementById('generateSvgBtn');
      try {
        btn.disabled = true;
        setStatus('Generating layered botanical SVG with Gemini...');
        const userPrompt = document.getElementById('svgPrompt').value.trim();
        const category = document.getElementById('svgCategory').value;
        const bioluminescent = document.getElementById('svgGlow').value === 'true';

        const schema = {
          type: 'object',
          properties: {
            name: { type: 'string' },
            latinName: { type: 'string' },
            sku: { type: 'string' },
            category: { type: 'string', enum: ['flora', 'hardscape'] },
            price: { type: 'number' },
            bioluminescent: { type: 'boolean' },
            svgCode: {
              type: 'string',
              description:
                'Valid, self-contained <svg viewBox="-50 -70 100 85" width="160" height="160" xmlns="http://www.w3.org/2000/svg">...</svg> with rich botanical vector paths, gradients, and organic details anchored near (0,0).',
            },
          },
          required: ['name', 'latinName', 'sku', 'category', 'price', 'bioluminescent', 'svgCode'],
        };

        const fullPrompt = `You are the lead botanical & industrial SVG illustrator for TerraScape (custom terrariums & smart vivarium hardware).
Create a detailed, multi-layered vector illustration for: "${userPrompt}".
Category: ${category}. Bioluminescent: ${bioluminescent}.
Requirements for svgCode:
- Must be a valid, standalone <svg viewBox="-50 -70 100 85" width="160" height="160" xmlns="http://www.w3.org/2000/svg">...</svg>.
- Base of the plant/hardscape must anchor around (0, 0) and grow upward toward negative Y (-10 to -68).
- Use rich layered <path>, <ellipse>, and <circle> elements with organic curves, leaf veins, highlights, and depth.`;

        const result = await callGeminiInteractions(fullPrompt, schema);
        parent.postMessage({ pluginMessage: { type: 'INSERT_SVG', payload: result } }, '*');
        setStatus(`Created "${result.name}" (${result.sku}) on Figma canvas!`);
      } catch (err) {
        setStatus(err.message || String(err), true);
      } finally {
        btn.disabled = false;
      }
    });

    // 2. Generate Auto-Layout UI & Hardware Spec Cards
    document.getElementById('generateLayoutBtn').addEventListener('click', async () => {
      const btn = document.getElementById('generateLayoutBtn');
      try {
        btn.disabled = true;
        setStatus('Designing Figma Auto-Layout frames & hardware schematics with Gemini...');
        const userPrompt = document.getElementById('layoutPrompt').value.trim();

        const schema = {
          type: 'object',
          properties: {
            frameTitle: { type: 'string' },
            sectionSubtitle: { type: 'string' },
            accentHex: { type: 'string' },
            cards: {
              type: 'array',
              items: {
                type: 'object',
                properties: {
                  title: { type: 'string' },
                  sku: { type: 'string' },
                  subtitle: { type: 'string' },
                  specs: { type: 'array', items: { type: 'string' } },
                  powerDraw: { type: 'string' },
                  price: { type: 'number' },
                  schematicSvg: {
                    type: 'string',
                    description:
                      'Valid standalone <svg viewBox="0 0 240 110" width="240" height="110" xmlns="http://www.w3.org/2000/svg">...</svg> technical diagram or botanical vessel preview using emerald (#10b981) and amber (#fbbf24) vector strokes on dark background (#141210). Only use <rect>, <circle>, <path>, <line> (no <text> inside SVG).',
                  },
                },
                required: ['title', 'sku', 'subtitle', 'specs', 'powerDraw', 'price', 'schematicSvg'],
              },
            },
          },
          required: ['frameTitle', 'sectionSubtitle', 'accentHex', 'cards'],
        };

        const fullPrompt = `You are designing a dark-mode UI section for TerraScape (custom botanical terrariums + smart PCB hardware by Vicky Adebona & Andrew Hung).
Design a 3-card Figma Auto-Layout section for: "${userPrompt}".
Include clean vector technical diagrams in schematicSvg (using only <rect>, <circle>, <path>, <line> elements—no <text> tags inside schematicSvg so Figma can parse it without font errors).`;

        const result = await callGeminiInteractions(fullPrompt, schema);
        parent.postMessage({ pluginMessage: { type: 'INSERT_UI_LAYOUT', payload: result } }, '*');
        setStatus(`Generated "${result.frameTitle}" Auto-Layout frame on canvas!`);
      } catch (err) {
        setStatus(err.message || String(err), true);
      } finally {
        btn.disabled = false;
      }
    });

    // 3. Export Selected Figma Nodes to TerraScape
    document.getElementById('exportSelectionBtn').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'EXPORT_SELECTION' } }, '*');
    });

    // Optional: Optimize exported SVG into React JSX with Day/Night bioluminescence via Gemini
    document.getElementById('optimizeWithGeminiBtn').addEventListener('click', async () => {
      if (!lastExportedItems.length) {
        setStatus('Click "Export Selected SVG" on a selected Figma node first.', true);
        return;
      }
      const btn = document.getElementById('optimizeWithGeminiBtn');
      try {
        btn.disabled = true;
        setStatus('Converting Figma SVG to TerrariumBuilder.tsx CatalogItem with Gemini...');

        const schema = {
          type: 'object',
          properties: {
            catalogItemTsx: {
              type: 'string',
              description:
                'Complete TypeScript CatalogItem entry with renderSvg: (isNight: boolean) => (...) ready to paste into CATALOG_ITEMS in src/TerrariumBuilder.tsx',
            },
          },
          required: ['catalogItemTsx'],
        };

        const item = lastExportedItems[0];
        const prompt = `Convert this raw SVG exported from Figma (node name: "${item.name}") into a clean React/TypeScript CatalogItem object for TerraScape's CATALOG_ITEMS array in src/TerrariumBuilder.tsx.
- Center/anchor the paths inside viewBox="-50 -70 100 85"
- Convert HTML attributes to React camelCase (strokeWidth, strokeLinecap, fillOpacity, etc.)
- Support the (isNight: boolean) parameter in renderSvg so bioluminescent or highlight accents subtly glow when isNight is true.

Raw Figma SVG:
${item.svgString}`;

        const result = await callGeminiInteractions(prompt, schema);
        exportOutput.textContent = result.catalogItemTsx;
        setStatus('Optimized into React JSX CatalogItem with Night Mode support!');
      } catch (err) {
        setStatus(err.message || String(err), true);
      } finally {
        btn.disabled = false;
      }
    });

    // Copy output button
    document.getElementById('copyOutputBtn').addEventListener('click', () => {
      const textarea = document.createElement('textarea');
      textarea.value = exportOutput.textContent;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      setStatus('Copied output to clipboard!');
    });

    // Receive messages from Figma main thread
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'INIT_API_KEY') {
        if (msg.apiKey) apiKeyInput.value = msg.apiKey;
        if (typeof msg.selectionCount === 'number') {
          selectionLabel.textContent =
            msg.selectionCount === 0
              ? '0 nodes'
              : `${msg.selectionCount} (${msg.selectionNames.join(', ')})`;
        }
      } else if (msg.type === 'SELECTION_CHANGED') {
        selectionLabel.textContent =
          msg.count === 0 ? '0 nodes' : `${msg.count} (${msg.names.join(', ')})`;
      } else if (msg.type === 'EXPORT_RESULT') {
        lastExportedItems = msg.items || [];
        const first = lastExportedItems[0];
        const innerSvg = first.svgString
          .replace(/<\?xml[^>]*>/g, '')
          .replace(/<svg[^>]*>/i, '<g>')
          .replace(/<\/svg>/i, '</g>')
          .trim();

        const snippet = `// 1. Add to CATALOG_ITEMS in src/TerrariumBuilder.tsx:
{
  id: '${first.id}',
  sku: 'FIG-${first.id.slice(0, 4).toUpperCase()}',
  name: '${first.name}',
  latin: 'Figma Custom Specimen',
  category: 'flora',
  price: 18,
  defaultScale: 1.0,
  renderSvg: (isNight: boolean) => (
    ${innerSvg}
  ),
},

// 2. Stage Placement Coordinates (400x500 stage):
${JSON.stringify(
  lastExportedItems.map((it, idx) => ({
    uid: `figma-${idx + 1}`,
    itemId: it.id,
    x: it.x,
    y: it.y,
    scale: 1,
    rotation: 0,
    flipX: false,
    zIndex: idx + 1,
  })),
  null,
  2
)}`;
        exportOutput.textContent = snippet;
        setStatus(`Exported ${lastExportedItems.length} node(s). Click "Gemini JSX + Night Mode" to auto-clean React props!`);
      } else if (msg.type === 'PLUGIN_ERROR' || msg.type === 'EXPORT_ERROR') {
        setStatus(msg.message, true);
      }
    };
  </script>
</body>
</html>
