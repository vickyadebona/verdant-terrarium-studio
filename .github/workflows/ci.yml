name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Test-only values. CI never touches Neon: the build needs no database, and the browser tests
# use the throwaway Postgres container below.
env:
  BETTER_AUTH_SECRET: ci-only-test-secret-not-used-anywhere-else-0123456789

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # A placeholder: the build loads the auth route but never connects.
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/none

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: terrascape
          POSTGRES_PASSWORD: terrascape
          POSTGRES_DB: terrascape
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrascape"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://terrascape:terrascape@localhost:5432/terrascape
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
